    <head>
        <title>Simple Pigpen Cipher</title>
        <!-- Wikipedia article on Pigpen cipher - https://en.wikipedia.org/wiki/Pigpen_cipher -->
        <!-- SVGs stolen from here and some styling stuff as well - https://caesarcipher.org/ciphers/pigpen -->
        <script>
            function processPigpenCipher() {
                text = grabText();
                document.getElementById("encrypted-text").innerHTML = '';
                for (let i = 0; i < text.length; i++) {
                    
                    currChar = text.charAt(i);

                    new_div = document.createElement("DIV");
                    new_div.className = "class-letter"

                    if(currChar.match(/[A-z]/i)) {
                        lowercase_char = currChar.toLowerCase()

                        pigpen_letter = document.getElementById("letter-"+lowercase_char)
                        cloned_letter = pigpen_letter.cloneNode(true)
                        new_div.appendChild(cloned_letter)

                        document.getElementById("encrypted-text").appendChild(new_div)
                    } else {
                        new_div.textContent = currChar
                        document.getElementById("encrypted-text").appendChild(new_div)
                    }
                }
                
            }

            function grabText() {
                return document.getElementById("pre-cipher-text").value;
            }
        </script>
        <style>
            textarea {
                width:80%;
                height: 30%;
                margin-left: 10%;
                margin-right: 10%;
            }
            h1 {
                text-align: center;
            }
            #button-row {
                text-align: center;
                margin-top: 2%;
                margin-bottom: 2%;
            }

            #letter-holder {
                display: none;
            }

            #encrypted-text {
                display: inline-block;
                line-height: 1.5;
                font-size: 32px;
            }
            .class-letter {
                margin-block: .25rem;
                margin-inline: .25rem;
                margin-top: .5rem;
                margin-bottom: .5rem;
                display: inline-block;
            }
            svg {
                vertical-align: middle;
            }
        </style>
